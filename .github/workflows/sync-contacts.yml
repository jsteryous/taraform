name: Sync contacts to Google

# One-way push of Taraform contacts into a dedicated Google account, which the phone syncs
# natively so callbacks show a name instead of an unknown number.
# Setup + secrets: scripts/PHONE_SYNC.md
#
# MANUAL ONLY since 2026-08-05. The nightly schedule moved to pg_cron -> the phone-sync-run
# Edge Function (scripts/PHONE_SYNC_MULTIUSER.md), which syncs every connected user. Running
# both against the same Google account churns: they compute their own client priority, so
# they can disagree on which duplicate wins and swap create/delete pairs every night.
# This workflow survives as the fallback if the hosted path breaks -- pause the cron job
# (`select cron.unschedule('phone-sync-nightly')`) before dispatching it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only — report what would change without writing to Google'
        type: boolean
        default: false

# Two overlapping runs would both see the same "missing" contacts and double-create them.
concurrency:
  group: sync-contacts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - name: Sync
        run: node scripts/phone-sync.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SYNC_USER_EMAIL: ${{ secrets.SYNC_USER_EMAIL }}
          SYNC_USER_PASSWORD: ${{ secrets.SYNC_USER_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
